services:
  postgres:
    image: postgres:16
    container_name: ged-postgres
    environment:
      POSTGRES_DB: ged_db
      POSTGRES_USER: ged_app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ged-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: ged-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ged-minio-data:/data

volumes:
  ged-postgres-data:
  ged-minio-data:
